services:
  tailnet-client:
    build: .
    container_name: tailnet-client
    hostname: tailnet-client
    # Expose the GUI only on localhost — not to the wider network
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      # Persist tailscale state across restarts
      - ./data:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Optional: set your auth key here or enter it in the GUI
      # TS_AUTHKEY: tskey-auth-xxxx
      - GUI_PORT=3000
      - TS_STATE_DIR=/var/lib/tailscale  # Tells Tailscale where to save state
      - TS_USERSPACE=false
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    privileged: true
    restart: unless-stopped
